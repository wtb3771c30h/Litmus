name: Bug report
description: Something measured, verified or rendered differently than the documentation says
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What the tool did, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The command, the input (or a minimal excerpt), and the output.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: false
