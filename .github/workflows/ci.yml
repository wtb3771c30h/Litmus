name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.os }}-${{ hashFiles('**/Cargo.toml') }}

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --release --verbose

      - name: Test
        run: cargo test --verbose

      - name: Smoke-test the CLI on the example scenarios
        shell: bash
        run: |
          bin=./target/release/litmus
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" check scenarios/deterministic-echo.litmus
          "$bin" check scenarios/normalized-timestamp.litmus
          "$bin" check scenarios/set-order-fixed.litmus
          "$bin" run   scenarios/set-order-flaky.litmus

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Type-check and build
        working-directory: tools
        run: npx --yes typescript@5.8.3 tsc -p tsconfig.json

      - name: Test
        working-directory: tools
        run: node --test dist/litmus.test.js

  pipeline:
    name: End-to-end (Rust -> TypeScript)
    runs-on: ubuntu-latest
    needs: [rust, typescript]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build both sides
        run: |
          cargo build --release
          cd tools && npx --yes typescript@5.8.3 tsc -p tsconfig.json

      - name: Emit evidence and render HTML
        run: |
          ./target/release/litmus emit scenarios/flaky-random-outcome.litmus --out evidence.json
          node tools/dist/cli.js html evidence.json --out report.html
          test -s report.html
          grep -q "litmus ::" report.html

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: litmus-report
          path: |
            evidence.json
            report.html
