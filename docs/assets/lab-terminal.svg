<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img"
     aria-labelledby="termTitle termDesc" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace">
  <title id="termTitle">litmus laboratory terminal: stable and diverged evidence</title>
  <desc id="termDesc">A lab-notebook terminal printing a litmus report: a stable scenario collapsing to
  one outcome group, and a flaky scenario fanning out into four outcome groups with frequency bars.</desc>

  <defs>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf3e7"/><stop offset="1" stop-color="#f6ecda"/>
    </linearGradient>
    <style>
      .bar{transform-origin:left center;animation:grow 2.4s ease-out infinite}
      @keyframes grow{0%{transform:scaleX(0)}30%{transform:scaleX(1)}100%{transform:scaleX(1)}}
      .cursor{animation:blink 1.05s steps(2) infinite}
      @keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}
      .type{animation:type 5s steps(40) infinite}
