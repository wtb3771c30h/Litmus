<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" role="img"
     aria-labelledby="heroTitle heroDesc" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <title id="heroTitle">litmus: many runs diverging into outcome fingerprints</title>
  <desc id="heroDesc">A single command is dispatched as repeated runs; identical waveforms collapse
  into one stable fingerprint while a divergent run fans out into a distinct outcome fingerprint.</desc>

  <defs>
    <linearGradient id="bench" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf3e7"/>
      <stop offset="1" stop-color="#f4e7d2"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 z" fill="#c9b48f"/>
    </marker>
    <style>
      .ink{fill:#243049}.muted{fill:#6b6152}.cream{fill:#fbf3e7}
      .wave{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
      .dash{stroke-dasharray:560;stroke-dashoffset:560;animation:draw 3.6s ease-in-out infinite}
      .d2{animation-delay:.4s}.d3{animation-delay:.8s}.d4{animation-delay:1.2s}
      @keyframes draw{0%{stroke-dashoffset:560}
        35%{stroke-dashoffset:0}75%{stroke-dashoffset:0;opacity:1}
        92%{opacity:.15}100%{stroke-dashoffset:560;opacity:0}}
      .pulse{animation:pulse 2.6s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
      .blink{animation:blink 1.1s steps(2) infinite}
      @keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}
      .glow{animation:glow 3s ease-in-out infinite}
      @keyframes glow{0%,100%{opacity:.6}50%{opacity:1}}
      @media (prefers-reduced-motion: reduce){
        .dash,.pulse,.blink,.glow{animation:none;stroke-dashoffset:0;opacity:1}}
    </style>
  </defs>

  <rect width="880" height="360" fill="url(#bench)"/>
  <rect x="1" y="1" width="878" height="358" fill="none" stroke="#e7d5b8" stroke-width="2"/>

  <g stroke="#ecdcc0" stroke-width="1">
    <line x1="0" y1="90" x2="880" y2="90"/><line x1="0" y1="180" x2="880" y2="180"/>
    <line x1="0" y1="270" x2="880" y2="270"/>
    <line x1="220" y1="70" x2="220" y2="330"/><line x1="620" y1="70" x2="620" y2="330"/>
  </g>

  <text x="28" y="40" class="ink" font-size="26" font-weight="700">litmus</text>
  <text x="122" y="40" class="muted" font-size="14">flaky-behavior experiment bench</text>
  <text x="28" y="60" class="muted" font-size="12">run → normalize → fingerprint → verdict</text>

  <!-- LEFT: the source scenario emitting runs -->
  <rect x="26" y="150" width="150" height="60" rx="10" class="cream" stroke="#ff7a59" stroke-width="2"/>
  <text x="101" y="176" text-anchor="middle" class="ink" font-size="13" font-weight="600">scenario</text>
  <text x="101" y="196" text-anchor="middle" class="muted" font-size="11" font-family="monospace">runs = 12</text>
  <circle cx="176" cy="180" r="5" class="pulse" fill="#ff7a59"/>

  <!-- MIDDLE: run waveforms, a stable family (coral + cobalt) and one diverging (cobalt) -->
  <g class="wave" stroke="#ff7a59" filter="url(#soft)">
    <path class="dash"    d="M220 120 q30 -26 60 0 t60 0 t60 0 t60 0 t60 0"/>
    <path class="dash d2" d="M220 150 q30 -26 60 0 t60 0 t60 0 t60 0 t60 0"/>
    <path class="dash d3" d="M220 210 q30 -26 60 0 t60 0 t60 0 t60 0 t60 0"/>
  </g>
  <g class="wave" stroke="#4f74f2" filter="url(#soft)">
    <path class="dash d2" d="M220 180 q30 -26 60 0 t60 0 t60 0 t60 0 t60 0"/>
  </g>
  <!-- the divergent run -->
  <g class="wave" stroke="#1f4bd8" filter="url(#soft)">
    <path class="dash d4" d="M220 250 q20 34 40 0 t40 -22 t40 30 t40 -18 t40 12 t40 0 t40 0"/>
  </g>

  <text x="300" y="312" class="muted" font-size="11" font-family="monospace">normalize: &lt;ts&gt; &lt;hex&gt; &lt;tmp&gt; · sort_lines · drop_substring</text>

  <!-- RIGHT: outcome fingerprints -->
  <rect x="640" y="96" width="212" height="70" rx="12" class="cream"/>
  <rect x="640" y="96" width="212" height="70" rx="12" fill="none" stroke="#1f4bd8" stroke-width="2.5" class="glow"/>
  <text x="656" y="120" class="ink" font-size="12" font-weight="700">STABLE · 11/12</text>
  <text x="656" y="140" class="muted" font-size="11" font-family="monospace">fp=ba9b8db45a8f6fe6</text>
  <rect x="656" y="150" width="152" height="8" rx="4" fill="#1f4bd8" opacity="0.85"/>

  <rect x="640" y="196" width="212" height="70" rx="12" class="cream"/>
  <rect x="640" y="196" width="212" height="70" rx="12" fill="none" stroke="#ff7a59" stroke-width="2.5"/>
  <text x="656" y="220" class="ink" font-size="12" font-weight="700">DIVERGED · 1/12</text>
  <text x="656" y="240" class="muted" font-size="11" font-family="monospace">fp=fe920309f32cf24f</text>
  <rect x="656" y="250" width="14" height="8" rx="4" fill="#ff7a59"/>
  <rect x="676" y="250" width="90" height="8" rx="4" fill="#f0dcc0"/>
  <circle cx="832" cy="231" r="5" class="blink" fill="#ff7a59"/>

  <!-- flow arrows into the fingerprint cards -->
  <g stroke="#c9b48f" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M602 132 H636"/>
    <path d="M602 231 H636"/>
  </g>

  <text x="852" y="350" text-anchor="end" class="muted" font-size="10">grouped by FNV-1a fingerprint · stable + diverged</text>
</svg>
