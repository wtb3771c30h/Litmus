<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" role="img"
     aria-labelledby="heroTitle heroDesc" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <title id="heroTitle">litmus: many runs diverging into outcome fingerprints</title>
  <desc id="heroDesc">A single command is dispatched as repeated runs; identical waveforms collapse
  into one stable fingerprint while a divergent run fans out into a distinct outcome fingerprint.</desc>

  <defs>
    <linearGradient id="bench" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf3e7"/>
      <stop offset="1" stop-color="#f4e7d2"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 z" fill="#c9b48f"/>
    </marker>
    <style>
      .ink{fill:#243049}.muted{fill:#6b6152}.cream{fill:#fbf3e7}
      .wave{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
      .dash{stroke-dasharray:560;stroke-dashoffset:560;animation:draw 3.6s ease-in-out infinite}
      .d2{animation-delay:.4s}.d3{animation-delay:.8s}.d4{animation-delay:1.2s}
      @keyframes draw{0%{stroke-dashoffset:560}
        35%{stroke-dashoffset:0}75%{stroke-dashoffset:0;opacity:1}
        92%{opacity:.15}100%{stroke-dashoffset:560;opacity:0}}
      .pulse{animation:pulse 2.6s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
      .blink{animation:blink 1.1s steps(2) infinite}
      @keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}
      .glow{animation:glow 3s ease-in-out infinite}
      @keyframes glow{0%,100%{opacity:.6}50%{opacity:1}}
      @media (prefers-reduced-motion: reduce){
        .dash,.pulse,.blink,.glow{animation:none;stroke-dashoffset:0;opacity:1}}
    </style>
  </defs>
